# JMPLNK.uk, running on the network hub (10.88.0.1) next to dannyarnold.com.
#
# Public path:  visitor -> Cloudflare (HTTPS 443) -> can (Nginx Proxy Manager) -> VPN -> here
# The hub's firewall only lets port 8083 in over the VPN, so NPM on can is the only way in:
#   jmplnk.uk  ->  http://10.88.0.1:8083
#
# Needs a .env file next to this one (copy .env.example). See DEPLOY.md.
name: jmplnk

x-logging: &logging
  driver: journald

services:
  postgres:
    image: postgres:16-alpine
    container_name: jmplnk-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      - POSTGRES_DB=qrgen
      - POSTGRES_USER=qrgen_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env next to docker-compose.yml}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrgen_user -d qrgen"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jmplnk:
    build: .
    container_name: jmplnk
    restart: unless-stopped
    logging: *logging
    ports:
      - "8083:8080"
    environment:
      - DATABASE_URL=postgresql://qrgen_user:${POSTGRES_PASSWORD}@postgres:5432/qrgen
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env next to docker-compose.yml}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://jmplnk.uk}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - VISIT_RETENTION_DAYS=${VISIT_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
